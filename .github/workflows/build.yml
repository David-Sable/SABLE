# Every push to main: engine tests (with sanitizers), app tests, and a signed APK published as a GitHub release,
# so a change made from anywhere (a PC or a cloud session) can be installed on the phone from the Releases page.
#
# Signing: the APK is signed with the same key as the copy already on the phone, so it installs as an update and keeps
# the library analysis and learning. The key lives only in the repository secret SABLE_KEYSTORE_B64 (base64 of the
# keystore), never in the code. Without the secret the APK is still built and tested, but not published.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (clang, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DSABLE_SANITIZE=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j 2>&1 | tee build.log
      - name: Report compiler errors as annotations (logs need sign-in; annotations are public)
        if: failure()
        run: |
          grep -E "error|Error" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Test
        run: ./build/sable_tests

  app:
    name: App tests and APK
    needs: engine  # never publish an APK whose engine failed its tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK packages (the runner's preinstalled SDK; same versions as the PC toolchain)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "ndk;30.0.16248370" "cmake;4.1.2" 2>&1 | tail -5 | tee sdk.log
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Report SDK errors
        if: failure()
        run: |
          tail -5 sdk.log | while IFS= read -r l; do echo "::error::$l"; done
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SABLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::SABLE_KEYSTORE_B64 is not set: the APK will not match the phone's copy and is not published."
          fi
      - name: Test and build
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee ../gradle.log
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A2 gradle.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          NAME="SABLE-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SABLE ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Built from ${{ github.sha }}.
            On the phone: open this page, tap **${{ steps.apk.outputs.name }}**, then open the download to install it over the current SABLE (your library and settings are kept).
          files: ${{ steps.apk.outputs.name }}
          make_latest: true
