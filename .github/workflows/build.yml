# Every push to main: engine tests (with sanitizers), app tests, and a signed APK published as a GitHub release,
# so a change made from anywhere (a PC or a cloud session) can be installed on the phone from the Releases page.
#
# Signing: the APK is signed with the same key as the copy already on the phone, so it installs as an update and keeps
# the library analysis and learning. The key lives only in the repository secret SABLE_KEYSTORE_B64 (base64 of the
# keystore), never in the code. Without the secret the APK is still built and tested, but not published.
name: build

on:
  push:
    branches: [main]
    paths-ignore:  # notes and docs only: no new build or release
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

#
# Third-party actions are pinned to full commit hashes (a moved version tag cannot change what runs next to the signing
# key's job). To update one: git ls-remote https://github.com/<action> refs/tags/<tag>
permissions:
  contents: read  # only the job that publishes gets write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a run on main is never cut off halfway through publishing

jobs:
  engine:
    name: Engine tests (clang, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DSABLE_SANITIZE=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j 2>&1 | tee build.log
      - name: Report compiler errors as annotations (logs need sign-in; annotations are public)
        if: failure()
        run: |
          grep -E "error|Error" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Test
        run: ./build/sable_tests

  app:
    name: App tests and APK
    needs: engine  # never publish an APK whose engine failed its tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # publishes releases and removes old ones
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK packages (the runner's preinstalled SDK; same versions as the PC toolchain)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "ndk;30.0.16248370" "cmake;4.1.2" 2>&1 | tail -5 | tee sdk.log
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Report SDK errors
        if: failure()
        run: |
          tail -5 sdk.log | while IFS= read -r l; do echo "::error::$l"; done
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SABLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sable.keystore"
            echo "SABLE_KEYSTORE=$RUNNER_TEMP/sable.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::SABLE_KEYSTORE_B64 is not set: the APK will not match the phone's copy and is not published."
          fi
      - name: Test and build
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee ../gradle.log
      - name: Remove the signing key from the runner (nothing after this step needs it)
        if: always()
        run: rm -f "$RUNNER_TEMP/sable.keystore"
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A2 gradle.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          NAME="SABLE-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check the signature matches the phone's copy
        if: env.SIGNED == '1'
        run: |
          # Public fingerprint of the key the installed SABLE was signed with (not a secret).
          WANT="0786a9322826d1ff2a795e5e479a173882ef37f4c056ba4d0dc196d846193be2"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          GOT=$("$BT/apksigner" verify --print-certs "${{ steps.apk.outputs.name }}" | grep -m1 "SHA-256" | awk '{print $NF}')
          echo "certificate $GOT"
          if [ "$GOT" != "$WANT" ]; then echo "::error::APK signed with $GOT, expected $WANT: it would not install over the phone's copy"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == '1'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SABLE ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Built from ${{ github.sha }}.
            On the phone: open this page, tap **${{ steps.apk.outputs.name }}**, then open the download to install it over the current SABLE (your library and settings are kept).
          files: ${{ steps.apk.outputs.name }}
          make_latest: true
      - name: Keep this version for good (commit message contains [keep])
        # Known-good versions to go back to: a permanent release keep-<version> that the cleanup below never touches.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == '1' && contains(github.event.head_commit.message, '[keep]')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: keep-${{ steps.apk.outputs.version }}
          name: SABLE ${{ steps.apk.outputs.version }} (kept, known good)
          body: |
            A version kept on purpose to go back to. Built from ${{ github.sha }}.
          files: ${{ steps.apk.outputs.name }}
          make_latest: false
      - name: Keep the exact build proven on the phone (commit message contains [keep build-N])
        # The same APK David listened to, byte for byte, not a rebuild. Runs before the cleanup, so build-N is still there.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == '1' && contains(github.event.head_commit.message, '[keep build-')
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          N=$(printf '%s' "$MESSAGE" | grep -oE '\[keep build-[0-9]+\]' | head -1 | grep -oE '[0-9]+')
          if [ -z "$N" ]; then echo "::error::no [keep build-N] in the commit message"; exit 1; fi
          mkdir kept
          gh release download "build-$N" --repo "${{ github.repository }}" --pattern '*.apk' --dir kept
          APK=$(ls kept/*.apk)
          VERSION=$(basename "$APK" | sed -E 's/^SABLE-(.*)-build[0-9]+\.apk$/\1/')
          COMMIT=$(gh api "repos/${{ github.repository }}/commits/build-$N" --jq .sha)
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          gh release create "keep-$VERSION" "$APK" --repo "${{ github.repository }}" --target "$COMMIT" --latest=false \
            --title "SABLE $VERSION (kept, known good)" \
            --notes "A version kept on purpose to go back to: build $N, the exact APK proven on the phone. Built from $COMMIT. SHA-256 $SUM."
      - name: Keep only the newest releases
        # The newest three build-N releases stay (this one and two to go back to); older ones and their tags are deleted.
        # Kept releases (keep-<version>) are never deleted.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.tag_name | startswith("build-"))] | sort_by(.created_at) | reverse | .[3:][] | .tag_name' |
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || echo "::warning::could not delete $tag"
          done
